<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Absurdities — projects and experiments.">
  <meta property="og:title" content="Absurdities">
  <meta property="og:description" content="Projects and experiments.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://absurdities.github.io/">
  <meta property="og:image" content="https://absurdities.github.io/assets/logo.png">
  <title>Absurdities — Projects</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preload" href="assets/mark.webp" as="image" fetchpriority="high">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page">
    <header>
      <a class="brand" href="./" aria-label="Absurdities, home">Absurdities</a>
      <nav aria-label="Main navigation">
        <a href="#projects">Projects</a>
        <a href="https://github.com/Absurdities">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title">Absurdities<span aria-hidden="true">.</span></h1>
          <p>Projects &amp; experiments.</p>
          <a class="text-link" href="#projects">View projects <span aria-hidden="true">↓</span></a>
        </div>
        <img class="mark" src="assets/mark.webp" width="1254" height="1254" fetchpriority="high" alt="An impossible triangle in warm gold on black.">
      </section>
      <section class="projects" id="projects" aria-labelledby="projects-title">
        <div class="section-heading">
          <h2 id="projects-title">Projects</h2>
          <span class="count" aria-label="0 projects">00</span>
        </div>
        <!-- Remove this empty state when publishing the first project. -->
        <div class="empty-state">
          <p>No projects published yet.</p>
          <a class="text-link" href="https://github.com/Absurdities">View on GitHub <span aria-hidden="true">↗</span></a>
        </div>
        <!-- Copy this entry for each real project, update its URL and content,
             remove the comment markers, and update the count above:
        <a class="project" href="https://github.com/Absurdities/REPOSITORY">
          <span class="project-number">01</span>
          <div><h3>Project name</h3><p>A short description of the project.</p></div>
          <span class="project-arrow" aria-hidden="true">↗</span>
        </a>
        -->
      </section>
    </main>
    <footer>
      <a class="brand" href="./">Absurdities</a>
      <a href="https://github.com/Absurdities" aria-label="Absurdities on GitHub">GitHub <span aria-hidden="true">↗</span></a>
    </footer>
  </div>
</body>
</html>
